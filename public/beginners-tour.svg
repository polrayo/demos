<svg
  width="24"
  height="24"
  viewBox="0 0 24 24"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="Beginner tour"
>
  <defs>
    <style>
      .stroke {
        fill: none;
        stroke: #00E47C;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .fill {
        fill: #00E47C;
      }
    </style>
  </defs>

  <!-- Play circle -->
  <circle
    cx="12"
    cy="12"
    r="9"
    class="stroke"
  />

  <!-- Play triangle -->
  <path
    d="M10 8 L16 12 L10 16 Z"
    class="fill"
  />

  <!-- Sparkles (tour / guided) -->
  <path d="M5 5 L5 3" class="stroke" />
  <path d="M5 5 L3 5" class="stroke" />
  <path d="M19 19 L19 21" class="stroke" />
  <path d="M19 19 L21 19" class="stroke" />
</svg>
